name: Compile and run tests

permissions:
  contents: read

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-tests:
    name: Tests on ${{ matrix.os }} with node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
          - 26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22 # build works only with 22+.

      - name: Install dependencies
        shell: bash
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Install Brave Browser (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main" \
            | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser
          echo "BRAVE_PATH=/usr/bin/brave-browser" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/brave-browser" >> "$GITHUB_ENV"

      - name: Install Brave Browser (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        shell: bash
        run: |
          brew install --cask brave-browser
          echo "BRAVE_PATH=/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" >> "$GITHUB_ENV"

      - name: Install Brave Browser (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          choco install brave -y --no-progress
          $braveExecutablePath = Join-Path $env:LOCALAPPDATA "BraveSoftware\Brave-Browser\Application\brave.exe"
          "BRAVE_PATH=$braveExecutablePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUPPETEER_EXECUTABLE_PATH=$braveExecutablePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: npm run bundle
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: ${{ matrix.node }}

      - name: Disable AppArmor
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Run tests
        shell: bash
        run: >
          npm run test:no-build -- --retry
          ${{ matrix.os == 'windows-latest' && '--test-concurrency=1' || '' }}

      - name: Run notices tests
        shell: bash
        run: >
          npm run test:notices:no-build

  # Gating job for branch protection.
  test-success:
    name: '[Required] Tests passed'
    runs-on: ubuntu-latest
    needs: run-tests
    if: ${{ !cancelled() }}
    steps:
      - if: ${{ needs.run-tests.result != 'success' }}
        run: 'exit 1'
      - run: 'exit 0'
