name: Release

on:
  workflow_dispatch:
    inputs:
      alias-version:
        description: 'Publish only the brave-devtools-mcp alias for an already-released version (e.g. 1.12.0). Leave empty for a normal release.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-release:
    name: Verify release
    if: ${{ inputs.alias-version == '' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-metadata.outputs.tag }}
    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must run from main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Read release metadata
        id: release-metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          NPM_ERROR_FILE=$(mktemp)
          if npm view "brave-mcp@${VERSION}" version --prefer-online > /dev/null 2> "$NPM_ERROR_FILE"; then
            echo "brave-mcp@${VERSION} is already published."
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found' "$NPM_ERROR_FILE"; then
            cat "$NPM_ERROR_FILE"
            exit 1
          fi

          ALIAS_ERROR_FILE=$(mktemp)
          if npm view "brave-devtools-mcp@${VERSION}" version --prefer-online > /dev/null 2> "$ALIAS_ERROR_FILE"; then
            echo "brave-devtools-mcp@${VERSION} is already published."
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found' "$ALIAS_ERROR_FILE"; then
            cat "$ALIAS_ERROR_FILE"
            exit 1
          fi

          GITHUB_ERROR_FILE=$(mktemp)
          if gh release view "$TAG" > /dev/null 2> "$GITHUB_ERROR_FILE"; then
            echo "Release ${TAG} already exists."
            exit 1
          fi
          if ! grep -Eq 'release not found|HTTP 404' "$GITHUB_ERROR_FILE"; then
            cat "$GITHUB_ERROR_FILE"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Sync DevTools dependencies
        run: npm run gclient-sync

      - name: Install Brave Browser
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main" \
            | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser
          echo "BRAVE_PATH=/usr/bin/brave-browser" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/brave-browser" >> "$GITHUB_ENV"

      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Build and bundle
        run: npm run bundle
        env:
          NODE_ENV: 'production'

      - name: Run tests
        run: npm run test:no-build

      - name: Run notices tests
        run: npm run test:notices:no-build

      - name: Verify npm package
        run: npm run verify-npm-package

      - name: Verify MCP metadata
        run: npm run verify-server-json-version

      - name: Remove node_modules
        run: rm -rf node_modules

      - name: Smoke test bundled binaries
        run: |
          node ./out/Default/gen/src/bin/brave-devtools-mcp.js --version
          node ./out/Default/gen/src/bin/brave-devtools.js --version

  create-draft-release:
    name: Create draft GitHub release
    if: ${{ inputs.alias-version == '' }}
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        run: |
          gh release create "${{ needs.verify-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.verify-release.outputs.tag }}" \
            --generate-notes \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}

  publish-to-npm:
    needs: create-draft-release
    if: ${{ inputs.alias-version == '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Sync DevTools dependencies
        shell: bash
        run: npm run gclient-sync

      - name: Build and bundle
        run: npm run bundle
        env:
          NODE_ENV: 'production'

      - name: Publish brave-mcp
        run: |
          npm publish --provenance --access public

      - name: Publish brave-devtools-mcp alias
        run: |
          node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.name = 'brave-devtools-mcp'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          npm publish --provenance --access public

      - name: Verify both packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for package in brave-mcp brave-devtools-mcp; do
            for attempt in $(seq 1 30); do
              if npm view "${package}@${VERSION}" version; then
                break
              fi
              if [ "${attempt}" = "30" ]; then
                echo "::error::${package}@${VERSION} did not become available on npm."
                exit 1
              fi
              echo "${package}@${VERSION} not available yet, retrying in 6s."
              sleep 6
            done
          done

  publish-npm-alias:
    name: Publish brave-devtools-mcp alias
    if: ${{ inputs.alias-version != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.alias-version }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Sync DevTools dependencies
        shell: bash
        run: npm run gclient-sync

      - name: Build and bundle
        run: npm run bundle
        env:
          NODE_ENV: 'production'

      - name: Publish brave-devtools-mcp alias
        env:
          ALIAS_VERSION: ${{ inputs.alias-version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${VERSION}" != "${ALIAS_VERSION}" ]; then
            echo "package.json version ${VERSION} does not match the requested ${ALIAS_VERSION}."
            exit 1
          fi
          if npm view "brave-devtools-mcp@${VERSION}" version --prefer-online > /dev/null 2>&1; then
            echo "brave-devtools-mcp@${VERSION} is already published."
            exit 1
          fi
          node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.name = 'brave-devtools-mcp'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          npm publish --provenance --access public
          for attempt in $(seq 1 30); do
            if npm view "brave-devtools-mcp@${VERSION}" version; then
              break
            fi
            if [ "${attempt}" = "30" ]; then
              echo "::error::brave-devtools-mcp@${VERSION} did not become available on npm."
              exit 1
            fi
            echo "brave-devtools-mcp@${VERSION} not available yet, retrying in 6s."
            sleep 6
          done

  publish-to-mcp-registry:
    needs: publish-to-npm
    if: ${{ inputs.alias-version == '' }}
    uses: ./.github/workflows/publish-to-mcp-registry-on-tag.yml

  publish-github-release:
    name: Publish GitHub release
    if: ${{ inputs.alias-version == '' }}
    needs:
      - verify-release
      - publish-to-mcp-registry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: |
          gh release edit "${{ needs.verify-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
