<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Brave DevTools MCP</title>
  <description id="description">Full Chrome DevTools MCP parity, rebuilt for Brave</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="0.55" stop-color="#171226" />
      <stop offset="1" stop-color="#32152a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45" />
      <stop offset="1" stop-color="#fb365d" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)" />
  <circle cx="1120" cy="95" r="190" fill="#fb542b" opacity="0.16" filter="url(#glow)" />
  <circle cx="75" cy="590" r="220" fill="#6e56cf" opacity="0.13" filter="url(#glow)" />

  <g transform="translate(72 70)">
    <path d="M58 0 108 29v58l-50 29L8 87V29Z" fill="url(#accent)" />
    <path d="M58 24 83 39v29L58 83 33 68V39Z" fill="#fff" opacity="0.96" />
    <path d="M58 38 70 45v15l-12 7-12-7V45Z" fill="#fb542b" />
  </g>

  <text x="210" y="114" fill="#ff7650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="4">BRAVE DEVTOOLS MCP</text>
  <text x="72" y="226" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="760">Full Chrome DevTools</text>
  <text x="72" y="300" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="760">MCP parity.</text>
  <text x="72" y="374" fill="#ff7650" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="760">Rebuilt for Brave.</text>

  <g transform="translate(72 438)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650">
    <g><rect width="128" height="38" rx="19" fill="#ffffff" opacity="0.09" /><text x="20" y="25" fill="#dce2ff">AUTOMATION</text></g>
    <g transform="translate(140)"><rect width="112" height="38" rx="19" fill="#ffffff" opacity="0.09" /><text x="20" y="25" fill="#dce2ff">NETWORK</text></g>
    <g transform="translate(264)"><rect width="152" height="38" rx="19" fill="#ffffff" opacity="0.09" /><text x="20" y="25" fill="#dce2ff">PERFORMANCE</text></g>
    <g transform="translate(428)"><rect width="104" height="38" rx="19" fill="#ffffff" opacity="0.09" /><text x="20" y="25" fill="#dce2ff">MEMORY</text></g>
  </g>

  <g transform="translate(745 155)">
    <rect width="463" height="330" rx="22" fill="#080b14" stroke="#ffffff" stroke-opacity="0.12" />
    <circle cx="30" cy="28" r="6" fill="#ff5f57" />
    <circle cx="50" cy="28" r="6" fill="#febc2e" />
    <circle cx="70" cy="28" r="6" fill="#28c840" />
    <line x1="0" y1="56" x2="463" y2="56" stroke="#ffffff" stroke-opacity="0.1" />
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
      <text x="28" y="101" fill="#7f8aaa">$</text>
      <text x="50" y="101" fill="#ffffff">npx brave-mcp@latest</text>
      <text x="28" y="153" fill="#67d391">+ 29 tools out of the box</text>
      <text x="28" y="197" fill="#67d391">+ upstream: 0 behind</text>
      <text x="28" y="241" fill="#67d391">+ telemetry: off by default</text>
      <text x="28" y="289" fill="#ff7650">Claude / Codex / Cursor / OpenCode</text>
    </g>
  </g>

  <text x="72" y="580" fill="#949db8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Network debugging. Performance traces. Memory analysis. Real Brave automation.</text>
</svg>
